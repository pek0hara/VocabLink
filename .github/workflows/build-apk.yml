name: Build APK

on:
  push:
    branches: [ "claude/**" ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        id: build
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build-output.log
        continue-on-error: true

      - name: Report build failure
        if: steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ERRORS=$(grep -E "^e:|error:|FAILURE|BUILD FAILED|Error:|Warning:" build-output.log | head -c 50000)
          gh issue create --title "Build APK failed - $(date -u +%Y-%m-%dT%H:%M:%S)" --body "## Compilation Errors
          \`\`\`
          ${ERRORS}
          \`\`\`"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
